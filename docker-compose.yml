services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slottrack-app
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    env_file:
      - .env
    restart: unless-stopped
